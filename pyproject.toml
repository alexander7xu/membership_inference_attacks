[project]
name = "membership-inference-attacks"
version = "0.1.0"
description = "Reproducible membership inference attack experiments."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.17",
  "jaxtyping>=0.2.34",
  "beartype>=0.18",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "F722", "F821", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"cli/attack_resnet_cifar10.py" = ["E402"]
